name: Recurring Payment Agent — unit tests and Worker bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test schedule recurrence, unique periods, unsigned payloads, strict paid receipt checks
        run: npm test
      - name: Validate SQLite Durable Object and Worker bundle
        run: npm run build
